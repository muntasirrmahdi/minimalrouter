name: Bug Report
description: Report a bug — something that's broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it quickly.

        **Before submitting**, please:
        - Search [existing issues](https://github.com/muntasirrmahdi/minimalrouter/issues) to avoid duplicates
        - Update to the latest version (re-run the install one-liner) and confirm the bug still exists
        - Check [docs/providers.md](https://github.com/muntasirrmahdi/minimalrouter/blob/main/docs/providers.md) — most provider failures are documented upstream gates or rationed free tiers, not router bugs
        - Never paste a real API key or token — redact it

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what's broken. Include error messages or tracebacks if relevant.
      placeholder: What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug. The more specific, the faster we can fix it.
      placeholder: |
        1. Run `minimalrouter serve`
        2. POST /v1/chat/completions with model "..."
        3. Error appears: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS 15 / WSL2
        - python3 -V: 3.12.x
        - Installed via: one-liner / checkout
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Excerpt
      description: Relevant lines from ~/.minimalrouter/minimalrouter.log (keys redacted). The FAIL line now carries the upstream's own error body — include it.
      render: text
    validations:
      required: false

  - type: textarea
    id: row
    attributes:
      label: Row Configuration (key removed)
      description: The row you were using, with the key/key_env value removed.
      render: json
    validations:
      required: false
