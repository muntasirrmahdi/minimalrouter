name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and JSON integrity
        run: |
          python -m py_compile minimalrouter.py minimalrouter_dashboard.py
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('*.json')]"
          sh -n install.sh
      - name: Offline unit tests (stdlib, zero network)
        run: python -m unittest discover -s tests -v
      - name: Lint (pyflakes class)
        run: |
          python -m pip install ruff==0.15.10
          ruff check --select F minimalrouter.py minimalrouter_dashboard.py tests

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Default install bundles the Mission Control board
        run: |
          FAKE_HOME="$(mktemp -d)"
          HOME="$FAKE_HOME" sh install.sh
          test -f "$FAKE_HOME/.minimalrouter/minimalrouter.py"
          test -f "$FAKE_HOME/.minimalrouter/minimalrouter_dashboard.py"
          test -f "$FAKE_HOME/.minimalrouter/bridges/zcode-identity.json"
          cmp minimalrouter.py "$FAKE_HOME/.minimalrouter/minimalrouter.py"
          cmp minimalrouter_dashboard.py "$FAKE_HOME/.minimalrouter/minimalrouter_dashboard.py"
          # the installer must have created the dashboard venv WITH textual
          test -x "$FAKE_HOME/.minimalrouter/.venv/bin/python3"
          "$FAKE_HOME/.minimalrouter/.venv/bin/python3" -c "import textual; from textual.app import App; print('venv textual OK')"
          # the launcher must be pinned to the venv python (beautiful board out of the box)
          grep -q "$FAKE_HOME/.minimalrouter/.venv/bin/python3" "$FAKE_HOME/.local/bin/minimalrouter"
          echo "default install bundles Textual + pins the launcher: OK"
          HOME="$FAKE_HOME" python3 -c "
          import json, os
          p = os.path.expanduser('~/.minimalrouter/rows.json')
          rows = json.load(open(p))
          assert rows[0]['name'] == 'kilocode-free', 'keyless row must be first'
          assert not rows[0].get('key') and not rows[0].get('key_env'), 'first row must be keyless'
          ident = json.load(open(os.path.expanduser('~/.minimalrouter/bridges/zcode-identity.json')))
          assert len(ident['stablePrefix']) == 3014, 'identity stablePrefix drift'
          print('install smoke OK: keyless-first seed + identity stablePrefix shipped')
          "
      - name: Zero-dep install (--curses) falls back to the curses board
        run: |
          FH2="$(mktemp -d)"
          HOME="$FH2" sh install.sh --curses
          test ! -d "$FH2/.minimalrouter/.venv"
          # no venv: with a python3 lacking textual, the loader must return None
          HOME="$FH2" python3 -c "
          import sys; sys.path.insert(0, '$FH2/.minimalrouter')
          import minimalrouter as mr
          assert mr._load_textual_dashboard() is None, 'must fall back to curses without textual'
          print('zero-dep curses fallback OK')
          "
          HOME="$FH2" python3 "$FH2/.minimalrouter/minimalrouter.py" -h >/dev/null
          echo "zero-dep install OK"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install textual (dashboard dependency only; core stays stdlib)
        run: python -m pip install textual==8.2.8
      - name: Full suite with textual present (dashboard tests run)
        run: python -m unittest discover -s tests -v
      - name: Textual board headless smoke (offline path, no server)
        run: |
          python - <<'PY'
          import asyncio, importlib.util
          spec = importlib.util.spec_from_file_location("mr_dash", "minimalrouter_dashboard.py")
          d = importlib.util.module_from_spec(spec); spec.loader.exec_module(d)
          async def go():
              app = d.MissionControl(port=8790)
              async with app.run_test(size=(120, 40)) as pilot:
                  await pilot.pause(0.5)
                  await pilot.press("p", "v", "q")
                  await pilot.pause(0.2)
          asyncio.run(go())
          print("textual board headless smoke OK")
          PY

  install-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Native Windows install (clean home)
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mr-home"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:USERPROFILE = $root
          $env:HOME = $root
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          & "$root\.local\bin\minimalrouter.cmd" -v
          if ($LASTEXITCODE -ne 0) { throw "launcher exited $LASTEXITCODE" }
          $bridge = Join-Path $root ".minimalrouter\bridges\zcode-identity.json"
          if (-not (Test-Path $bridge)) { throw "bridge asset missing" }
          $ident = Get-Content $bridge -Raw | ConvertFrom-Json
          if ($ident.stablePrefix.Length -ne 3014) { throw "stablePrefix length $($ident.stablePrefix.Length) != 3014" }
          $engine = Join-Path $root ".minimalrouter\minimalrouter.py"
          python $engine -v
          if ($LASTEXITCODE -ne 0) { throw "engine exited $LASTEXITCODE" }
          python $engine doctor --json > "$root\doctor.json" 2>&1
          if (-not (Test-Path "$root\doctor.json")) { throw "doctor produced no JSON" }
          Write-Host "native Windows install smoke OK"
          exit 0
